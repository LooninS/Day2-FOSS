name: Task 3 - Merge Conflict Bot

on:
  pull_request_target:
    types: [opened, reopened]
    paths:
      - "task3/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-conflict:
    name: Simulate merge conflict
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR and create conflicting base commit
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Only operate on PRs targeting the default branch.
            if (pr.base.ref !== context.payload.repository.default_branch) {
              core.setFailed("Task 3 PRs must target the default branch.");
              return;
            }

            const body = pr.body || "";
            const issuePattern =
              /\b(closes|closed|close|fixes|fixed|fix|resolves|resolved|resolve)\s+#3\b/i;

            if (!issuePattern.test(body)) {
              core.setFailed(
                "Your PR must reference Task 3 using Closes #3."
              );
              return;
            }

            // Find exactly one new Task 3 text file.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const submissions = files.filter(file =>
              file.status === "added" &&
              /^task3\/[A-Za-z]{3}[0-9]{7}\.txt$/.test(file.filename)
            );

            if (submissions.length !== 1) {
              core.setFailed(
                "Submit exactly one new task3/XXX2026YYY.txt file."
              );
              return;
            }

            const path = submissions[0].filename;
            const rollNumber = path.split("/").pop().replace(".txt", "");
            const baseBranch = pr.base.ref;

            // A unique submission file is required for each attendee.
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: baseBranch
              });

              core.setFailed(
                "This file already exists on the default branch. " +
                "Use a unique roll-number filename."
              );
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // Create a competing version on the base branch.
            // Do not checkout or execute any contributor code.
            const botContent = [
              "# Task 3 - Workshop bot",
              `Roll number: ${rollNumber}`,
              "Explain how this change should be integrated.",
              "The final pr should have both commits.",
              ""
            ].join("\n");

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `bot(task3): create conflict for ${rollNumber}`,
              content: Buffer.from(botContent).toString("base64"),
              branch: baseBranch
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body:
                "🤖 **Task 3 conflict created!**\n\n" +
                `I added a competing version of \`${path}\` to ` +
                `\`${baseBranch}\`.\n\n` +
                "Fetch the latest base branch, merge it into your branch, " +
                "resolve the conflict, commit the resolution, and push " +
                "to this same PR.\n\n" +
                "Do not close this PR to bypass the challenge."
            });

            core.info(`Created conflict for ${path}`);
